name: leafy
description: Leafy - Plant identification app powered by PlantNet & Supabase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase (replaces Firebase)
  supabase_flutter: ^2.3.4

  # State management
  provider: ^6.1.2

  # Navigation
  go_router: ^13.2.1

  # Camera & Gallery
  image_picker: ^1.0.7

  # HTTP (PlantNet API)
  http: ^1.2.1

  # Images
  cached_network_image: ^3.3.1

  # Date formatting
  intl: ^0.19.0

  # Local storage (theme preference)
  shared_preferences: ^2.2.3

  # Path utilities
  path_provider: ^2.1.3
  path: ^1.9.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
